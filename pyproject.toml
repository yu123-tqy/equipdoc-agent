[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equipdoc-agent"
version = "0.1.0"
description = "A reproducible industrial maintenance Agent demo with tool review and evidence-aware reporting."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Tian Qingyu" }]
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
demo = [
  "gradio>=6,<7",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.4,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "sqlalchemy>=2,<3",
]
postgres = [
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3,<4",
  "sqlalchemy>=2,<3",
]
ml = [
  "torch>=2.2,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
]
rag = [
  "chromadb>=0.6,<2",
  "sentence-transformers>=3,<6",
  "rank-bm25>=0.2,<1",
  "jieba>=0.42,<1",
]
serve = [
  "transformers>=4.45,<6",
  "accelerate>=1,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
equipdoc-health = "equipdoc_agent.health:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["scripts/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app_gradio.py" = ["E402"]
"scripts/build_rag_index.py" = ["E402"]
"scripts/demo_smoke.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
